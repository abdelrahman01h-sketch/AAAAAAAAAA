<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية - EduNova</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
</head>
<body>

<header class="nav" id="nav"></header>

<section class="section">
  <div class="container">
    <div class="welcome-banner glass">
      <div>
        <h1 id="welcomeTitle">أهلاً بيك 👋</h1>
        <p>استعرض امتحاناتك المتاحة وابدأ لما تكون جاهز.</p>
      </div>
      <a class="btn btn-ghost" href="account.html">👤 حسابي</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>الامتحانات المتاحة</h2>
        <p>اضغط على أي امتحان عشان تشوف تفاصيله الأول.</p>
      </div>
    </div>
    <div class="exam-grid" id="examGrid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>
</section>

<div class="footer">EduNova — Developed By Abdelrahman Mohamed</div>

<script type="module">
import { requireStudent, renderNav, fetchExams, escapeHtml, safeImageUrl } from "./platform.js";

const student = requireStudent();
if (student) {
  renderNav("home");
  document.getElementById("welcomeTitle").textContent = `أهلاً بيك يا ${student.name || "بطل"} 👋`;
  loadExams();
}

async function loadExams() {
  const grid = document.getElementById("examGrid");
  try {
    const exams = await fetchExams();

    if (!exams.length) {
      grid.innerHTML = `
        <div class="empty-state glass" style="grid-column:1/-1;">
          <div class="big">📭</div>
          <h3>لسه مفيش امتحانات متاحة</h3>
          <p>تابعنا، هيتم إضافة امتحانات قريبًا.</p>
        </div>`;
      return;
    }

    grid.innerHTML = exams.map(exam => {
      const img = safeImageUrl(exam.thumbnail);
      return `
        <a class="exam-card glass" href="exam-details.html?id=${encodeURIComponent(exam.id)}">
          <div class="thumb">
            ${img ? `<img src="${img}" alt="">` : `<span class="ph">📘</span>`}
          </div>
          <div class="body">
            <h3>${escapeHtml(exam.name || "امتحان")}</h3>
            <p class="desc">${escapeHtml(exam.description || "امتحان متاح دلوقتي على المنصة.")}</p>
            <div class="chips">
              ${exam.time ? `<span class="chip">⏱ ${escapeHtml(exam.time)} دقيقة</span>` : ""}
            </div>
            <span class="btn btn-primary btn-block">عرض التفاصيل</span>
          </div>
        </a>`;
    }).join("");

  } catch (e) {
    console.error(e);
    grid.innerHTML = `
      <div class="empty-state glass" style="grid-column:1/-1;">
        <div class="big">🔥</div>
        <h3>حصلت مشكلة في تحميل الامتحانات</h3>
        <p>جرب تحدّث الصفحة تاني.</p>
      </div>`;
  }
}
</script>
</body>
</html>
