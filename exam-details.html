<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الامتحان - EduNova</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
</head>
<body>

<header class="nav" id="nav"></header>

<section class="section">
  <div class="container">
    <div class="crumbs">
      <a href="home.html">🏠 الرئيسية</a> <span>/</span> <span id="crumbName">تفاصيل الامتحان</span>
    </div>

    <div id="content">
      <div class="skeleton" style="min-height:400px;"></div>
    </div>
  </div>
</section>

<div class="footer">EduNova — Developed By Abdelrahman Mohamed</div>

<script type="module">
import {
  db, doc, getDoc, collection, getDocs,
  requireStudent, renderNav, escapeHtml, safeImageUrl
} from "./platform.js";

const student = requireStudent();
if (student) {
  renderNav("home");
  load();
}

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function load() {
  const id = qs("id");
  const content = document.getElementById("content");

  if (!id) {
    content.innerHTML = notFound();
    return;
  }

  try {
    const snap = await getDoc(doc(db, "exams", id));
    if (!snap.exists()) {
      content.innerHTML = notFound();
      return;
    }
    const exam = snap.data();
    document.getElementById("crumbName").textContent = exam.name || "تفاصيل الامتحان";

    const qSnap = await getDocs(collection(db, "exams", id, "questions"));
    const img = safeImageUrl(exam.thumbnail);

    /* Check if this student already finished this exam */
    let alreadyFinished = false;
    try {
      const attemptSnap = await getDoc(doc(db, "students", student.id, "exams", exam.name));
      alreadyFinished = attemptSnap.exists() && attemptSnap.data().finished === true;
    } catch (e) { /* ignore — treat as not finished */ }

    content.innerHTML = `
      <div class="details">
        <div class="details-main glass">
          <div class="thumb">
            ${img ? `<img src="${img}" alt="">` : `<span class="ph">📘</span>`}
          </div>
          <div class="details-body">
            <h1>${escapeHtml(exam.name || "امتحان")}</h1>
            <p class="desc">${escapeHtml(exam.description || "امتحان متاح دلوقتي على المنصة. اقرا التفاصيل جنب واضغط ابدأ لما تكون جاهز.")}</p>
          </div>
        </div>

        <div class="details-side glass">
          <h3>معلومات الامتحان</h3>
          <div class="info-list">
            <div class="info-item"><span class="ic">⏱</span><div><small>المدة</small><b>${exam.time ? escapeHtml(exam.time) + " دقيقة" : "—"}</b></div></div>
            <div class="info-item"><span class="ic">❓</span><div><small>عدد الأسئلة</small><b>${qSnap.size}</b></div></div>
            <div class="info-item"><span class="ic">👤</span><div><small>الطالب</small><b>${escapeHtml(student.name)}</b></div></div>
          </div>
          ${
            alreadyFinished
              ? `<div class="msg error" style="margin-bottom:12px;">إنت خلصت الامتحان ده قبل كده ✅</div>
                 <a class="btn btn-ghost btn-block" href="home.html">رجوع للامتحانات</a>`
              : `<a class="btn btn-primary btn-block btn-lg" href="welcome.html?exam=${encodeURIComponent(id)}">🚀 ابدأ الامتحان</a>`
          }
        </div>
      </div>`;

  } catch (e) {
    console.error(e);
    content.innerHTML = notFound();
  }
}

function notFound() {
  return `
    <div class="empty-state glass">
      <div class="big">🔍</div>
      <h3>الامتحان ده مش موجود</h3>
      <p>ممكن يكون اتحذف أو الرابط غلط.</p>
      <a class="btn btn-primary" href="home.html">رجوع للامتحانات</a>
    </div>`;
}
</script>
</body>
</html>
